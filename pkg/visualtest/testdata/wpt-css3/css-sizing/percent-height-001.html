<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: percentage height with explicit parent height</title>
  <link rel="match" href="percent-height-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .parent {
      height: 200px;
    }
    /* 50% of parent's 200px = 100px */
    .child {
      height: 50%;
      width: 200px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="parent">
    <div class="child"></div>
  </div>
</body>
</html>
