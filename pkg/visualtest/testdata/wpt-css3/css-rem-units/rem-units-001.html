<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: rem units with default root font-size</title>
  <link rel="match" href="rem-units-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Default root font-size is 16px. 10rem = 160px, 5rem = 80px */

      width: 10rem;
      height: 5rem;

    }
  </style>
</head>
<body>
  <div class="box"></div>
