<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: flexbox min-width auto</title>
  <link rel="match" href="flex-min-auto-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Flex item with explicit min-width:0 allows shrinking below content.
       Without min-width:0, flex items have implicit min-width:auto which
       prevents shrinking below content size. Here we test the explicit case. */
    .flex {
      display: flex;
      width: 200px;
    }
    .fixed { width: 150px; height: 80px; background: blue; flex-shrink: 0; }
    .shrink {
      width: 200px;
      min-width: 0;
      height: 80px;
      background: green;
      flex-shrink: 1;
    }
  </style>
</head>
<body>
  <div class="flex">
    <div class="fixed"></div>
    <div class="shrink"></div>
  </div>
</body>
</html>
