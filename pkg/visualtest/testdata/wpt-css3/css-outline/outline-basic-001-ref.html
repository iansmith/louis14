<!DOCTYPE html>
<title>CSS outline reference</title>
<style>
  body { margin: 0; padding: 0; }
  p { margin: 16px 0 0 0; }
  .outer {
    position: absolute;
    left: 15px;
    top: 50px;
    width: 110px;
    height: 110px;
    background: blue;
  }
  .inner {
    position: absolute;
    left: 20px;
    top: 55px;
    width: 100px;
    height: 100px;
    background: lime;
  }
</style>
<p>Test passes if there is a green square with a blue outline.</p>
<div class="outer"></div><div class="inner"></div>
