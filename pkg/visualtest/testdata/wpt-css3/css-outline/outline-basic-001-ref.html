<!DOCTYPE html>
<title>CSS outline reference</title>
<style>
  .outer {
    width: 110px;
    height: 110px;
    background: blue;
    margin: 15px;
  }
  .inner {
    position: relative;
    top: 5px;
    left: 5px;
    width: 100px;
    height: 100px;
    background: lime;
  }
</style>
<p style="margin-bottom: 0">Test passes if there is a green square with a blue outline.</p>
<div class="outer"><div class="inner"></div></div>
