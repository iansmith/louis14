<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Basic User Interface Reference File</title>
<style>
  #parent {
    height: 110px;
    margin: 30px;
    outline-color: blue;
    outline-style: dotted;
    outline-width: 4px;
    padding: 20px;
    width: 110px;
  }
  #child {
    height: 110px;
    outline-color: green;
    outline-style: dotted;
    outline-width: 4px;
    width: 110px;
  }
</style>
<body>
  <p>Test passes if there is a blank square with <strong>a green dotted</strong> border centered inside a blue dotted border.</p>
  <div id="parent">
    <div id="child"></div>
  </div>
</body>
