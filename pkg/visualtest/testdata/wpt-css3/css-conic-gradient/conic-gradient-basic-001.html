<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: conic-gradient basic - single color fill</title>
  <link rel="author" title="Louis14 Project" href="https://github.com/nicholasgasior/louis14"/>
  <link rel="help" href="https://www.w3.org/TR/css-images-4/#conic-gradients"/>
  <link rel="match" href="conic-gradient-basic-001-ref.html"/>
  <meta name="assert" content="A conic-gradient with a single color stop spanning 0deg to 360deg should produce a solid fill of that color."/>
  <style type="text/css">
    body { margin: 0; background: white; }
    .box {
      width: 200px;
      height: 100px;
      background: conic-gradient(green 0deg, green 360deg);
    }
  </style>
</head>
<body>
  <p>Test passes if there is a green rectangle below.</p>
  <div class="box"></div>
</body>
</html>
