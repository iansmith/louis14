<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: skewX(0deg) is identity transform</title>
  <link rel="help" href="https://drafts.csswg.org/css-transforms-1/#funcdef-skewx" />
  <link rel="match" href="skew-transform-basic-001-ref.html" />
  <meta name="assert" content="skewX(0deg) is an identity transform and produces no visual change." />
</head>
<body style="margin:0;padding:0">
  <div style="width:100px;height:100px;background:green;transform:skewX(0deg)"></div>
</body>
</html>
