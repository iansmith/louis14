<!DOCTYPE html>

<head>
    <title>CSS Reftest Reference</title>
    <style>
        body { margin: 0; background: white; }
        p { margin: 0; height: 50px; }
        .green { background: green; }
    </style>
</head>
<body>
    <div>
        <span style="display:block;height:50px">Span (not a p)</span>
        <p>First p</p>
        <p class="green">Second p (should be green)</p>
    </div>
</body>
