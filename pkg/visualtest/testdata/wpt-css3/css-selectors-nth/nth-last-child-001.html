<!DOCTYPE html>
<html>
<head>
    <title>CSS Test: :nth-last-child(1) selects the last child</title>
    <link rel="match" href="nth-last-child-001-ref.html"/>
    <meta name="assert" content=":nth-last-child(1) should match the last child element, equivalent to :last-child."/>
    <style>
        body { margin: 0; background: white; }
        .item { height: 50px; margin: 0; }
        .item:nth-last-child(1) { background: green; }
    </style>
</head>
<body>
    <div>
        <div class="item">First</div>
        <div class="item">Second</div>
        <div class="item">Third (green)</div>
    </div>
</body>
</html>
