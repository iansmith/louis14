<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: @supports basic positive condition</title>
  <link rel="author" title="Louis14 Project" href="https://github.com/nicholasgasior/louis14"/>
  <link rel="help" href="https://www.w3.org/TR/css-conditional-3/#at-supports"/>
  <link rel="match" href="supports-basic-001-ref.html"/>
  <meta name="assert" content="@supports with a supported property declaration (display: flex) should apply its rules."/>
  <style type="text/css">
    body { margin: 0; background: white; }
    .box {
      width: 200px;
      height: 100px;
      background: red;
    }
    @supports (display: flex) {
      .box {
        background: green;
      }
    }
  </style>
</head>
<body>
  <p>Test passes if there is a green rectangle and no red.</p>
  <div class="box"></div>
</body>
</html>
