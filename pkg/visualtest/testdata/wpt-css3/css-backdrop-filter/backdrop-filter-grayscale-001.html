<!DOCTYPE html>
<title>CSS backdrop-filter: grayscale</title>
<link rel="match" href="backdrop-filter-grayscale-001-ref.html">
<style>
  body { margin: 0; }
  .container { position: relative; width: 200px; height: 200px; }
  .bg { position: absolute; top: 0; left: 0; width: 200px; height: 200px; background: red; }
  .overlay { position: absolute; top: 0; left: 0; width: 200px; height: 200px; backdrop-filter: grayscale(1); }
</style>
<div class="container">
  <div class="bg"></div>
  <div class="overlay"></div>
</div>
