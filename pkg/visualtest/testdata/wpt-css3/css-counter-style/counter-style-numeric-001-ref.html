<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference: @counter-style numeric system (decimal equivalent)</title>
  <style>
    body { margin: 0; padding: 10px; font-size: 16px; font-family: Ahem; }
    ol { list-style-type: decimal; padding-left: 2em; margin: 0; }
    li { margin: 0; }
  </style>
</head>
<body>
  <ol>
    <li>First item</li>
    <li>Second item</li>
    <li>Third item</li>
  </ol>
</body>
</html>
