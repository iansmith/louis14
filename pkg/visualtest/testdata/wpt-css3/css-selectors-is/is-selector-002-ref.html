<!DOCTYPE html>
<html>
<head>
<title>CSS selectors: :is() with element+class compound selectors (reference)</title>
<style>
  body { margin: 0; background: white; }
  .green {
    background: green;
    width: 100px;
    height: 50px;
    display: block;
  }
  .blue {
    display: block;
    width: 100px;
    height: 50px;
    background: blue;
  }
  .red {
    width: 100px;
    height: 50px;
    display: block;
    background: red;
  }
</style>
</head>
<body>
  <div class="green"></div>
  <div class="green"></div>
  <div class="blue"></div>
  <div class="red"></div>
</body>
</html>
