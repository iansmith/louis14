<!DOCTYPE html>
<title>CSS selectors: :where() pseudo-class (zero specificity)</title>
<link rel="match" href="where-selector-001-ref.html">
<style>
  div {
    width: 100px;
    height: 50px;
    background: green;
  }
  :where(.special) {
    background: red;
  }
  /* div selector (specificity 0,0,1) should beat :where(.special) (specificity 0,0,0) */
</style>
<p>Test passes if the rectangle is green (not red), because :where() has zero specificity.</p>
<div class="special"></div>
