<!DOCTYPE html>
<html>
<head>
  <title>Reference: flex order</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .flex { display: flex; width: 300px; }
    .item { width: 100px; height: 100px; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item" style="background:green"></div>
    <div class="item" style="background:blue"></div>
    <div class="item" style="background:red"></div>
  </div>
</body>
</html>
