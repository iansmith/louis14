<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: line-height specified in em units</title>
  <link rel="help" href="https://drafts.csswg.org/css-inline/#propdef-line-height" />
  <link rel="match" href="line-height-em-001-ref.html" />
  <meta charset="utf-8">
  <meta name="assert" content="line-height:2em with font-size:20px produces a 40px line-height. The green box height should match a 40px reference box." />
  <style>
    body { margin: 0; padding: 0; }
    /* line-height: 2em = 2 * font-size = 2 * 20px = 40px
       Container height = 1 line = 40px */
    .test {
      width: 100px;
      font-size: 20px;
      line-height: 2em;
      background: green;
      color: green;
    }
  </style>
</head>
<body>
  <div class="test">X</div>
</body>
</html>
