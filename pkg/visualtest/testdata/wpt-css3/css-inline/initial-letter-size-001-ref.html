<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: initial-letter creates a drop cap float (reference)</title>
  <style>
    body { margin: 0; padding: 10px; background: white; }
    p {
      font-size: 16px;
      line-height: 20px;
      font-family: Ahem;
      width: 300px;
    }
    .dropcap {
      float: left;
      font-size: 57.142857px;
      font-family: Ahem;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <p><span class="dropcap">H</span>ello</p>
</body>
</html>
