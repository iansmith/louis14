<!DOCTYPE html>
<html>
<head>
    <title>CSS Test: min() function picks the smaller value</title>
    <link rel="match" href="min-function-001-ref.html"/>
    <meta name="assert" content="width: min(200px, 50%) should resolve to 200px when 50% of 800px viewport is 400px."/>
    <style>
        body { margin: 0; background: white; }
        .box {
            width: min(200px, 50%);
            height: 100px;
            background: green;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
