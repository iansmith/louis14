<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: calc() with percentage in width</title>
  <link rel="match" href="calc-percent-width-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .container {
      width: 400px;
    }
    /* calc(100% - 200px) = 400 - 200 = 200px */
    .box {
      width: calc(100% - 200px);
      height: 100px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box"></div>
  </div>
</body>
</html>
