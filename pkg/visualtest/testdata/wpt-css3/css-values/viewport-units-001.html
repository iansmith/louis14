<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: vh and vw viewport units</title>
  <link rel="match" href="viewport-units-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* At 800x600 viewport: 80vw = 640px, 50vh = 300px */
    .box {
      width: 80vw;
      min-height: 50vh;
      background: green;
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
