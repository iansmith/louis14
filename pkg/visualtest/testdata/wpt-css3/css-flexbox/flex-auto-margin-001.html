<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: Auto margins in flex push items apart</title>
  <link rel="match" href="flex-auto-margin-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Navbar pattern: logo left, nav items pushed to right via margin-left:auto */
    .flex {
      display: flex;
      width: 400px;
      height: 50px;
      background: white;
    }
    .logo {
      width: 100px;
      height: 50px;
      background: green;
    }
    .nav {
      margin-left: auto; /* pushes to far right */
      width: 80px;
      height: 50px;
      background: blue;
    }
  </style>
</head>
<body>
  <div class="flex">
    <div class="logo"></div>
    <div class="nav"></div>
  </div>
</body>
</html>
