<!DOCTYPE html>
<html>
<head>
  <title>Reference: flexbox min-width auto</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* 200px container: 150px fixed + 50px shrunk (200 - 150 = 50) */
    .flex { display: flex; width: 200px; }
    .blue { width: 150px; height: 80px; background: blue; }
    .green { width: 50px; height: 80px; background: green; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="blue"></div>
    <div class="green"></div>
  </div>
</body>
</html>
