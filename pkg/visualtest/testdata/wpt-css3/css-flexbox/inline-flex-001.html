<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: display inline-flex shrink-to-fit</title>
  <link rel="match" href="inline-flex-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* inline-flex container shrinks to fit its items */
    .iflex {
      display: inline-flex;
      background: green;
    }
    .item { width: 50px; height: 80px; }
  </style>
</head>
<body>
  <div class="iflex">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
</body>
</html>
