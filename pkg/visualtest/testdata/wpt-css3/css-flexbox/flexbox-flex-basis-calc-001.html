<!DOCTYPE html>
<html>
<head>
<title>CSS Test: flex-basis with calc() percentage</title>
<link rel="match" href="flexbox-flex-basis-calc-001-ref.html">
<style>
  body { margin: 0; background: white; }
  .container {
    display: flex;
    width: 400px;
    height: 100px;
    background: white;
    gap: 20px;
    flex-wrap: nowrap;
  }
  .item {
    flex-grow: 0;
    flex-shrink: 0;
    flex-basis: calc(50% - 10px);
    height: 100px;
  }
  .item:nth-child(1) { background: green; }
  .item:nth-child(2) { background: blue; }
</style>
</head>
<body>
  <!--
    Container: 400px wide, gap: 20px
    calc(50% - 10px) = 200px - 10px = 190px per item
    190px + 20px gap + 190px = 400px exactly — fills container perfectly
  -->
  <div class="container">
    <div class="item"></div>
    <div class="item"></div>
  </div>
</body>
</html>
