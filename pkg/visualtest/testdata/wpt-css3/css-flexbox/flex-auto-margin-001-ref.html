<!DOCTYPE html>
<html>
<head>
  <title>Reference: Auto margins in flex</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .container {
      width: 400px;
      height: 50px;
      position: relative;
    }
    .logo {
      position: absolute;
      left: 0;
      top: 0;
      width: 100px;
      height: 50px;
      background: green;
    }
    /* nav at far right: 400 - 80 = 320 */
    .nav {
      position: absolute;
      left: 320px;
      top: 0;
      width: 80px;
      height: 50px;
      background: blue;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"></div>
    <div class="nav"></div>
  </div>
</body>
</html>
