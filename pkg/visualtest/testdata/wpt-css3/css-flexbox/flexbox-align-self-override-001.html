<!DOCTYPE html>
<html>
<head>
<title>CSS Test: align-self overrides align-items on individual flex items</title>
<link rel="match" href="flexbox-align-self-override-001-ref.html">
<style>
  body { margin: 0; background: white; }
  .container {
    display: flex;
    flex-direction: row;
    width: 300px;
    height: 120px;
    background: white;
    align-items: flex-start;
  }
  .item {
    flex: none;
    width: 80px;
  }
  /* Item 1: inherits align-items: flex-start → top-aligned, natural height */
  .item1 {
    background: red;
    height: 40px;
  }
  /* Item 2: align-self: center overrides align-items → vertically centered */
  .item2 {
    background: green;
    height: 40px;
    align-self: center;
  }
  /* Item 3: align-self: flex-end overrides align-items → bottom-aligned */
  .item3 {
    background: blue;
    height: 40px;
    align-self: flex-end;
  }
</style>
</head>
<body>
  <!--
    Container: 300px × 120px, align-items: flex-start
    Item 1 (red): top: 0, height: 40 → occupies y=0..40
    Item 2 (green): align-self: center → top: (120-40)/2=40, height: 40 → occupies y=40..80
    Item 3 (blue): align-self: flex-end → top: 120-40=80, height: 40 → occupies y=80..120
  -->
  <div class="container">
    <div class="item item1"></div>
    <div class="item item2"></div>
    <div class="item item3"></div>
  </div>
</body>
</html>
