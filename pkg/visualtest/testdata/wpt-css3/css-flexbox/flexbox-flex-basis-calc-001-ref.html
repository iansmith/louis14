<!DOCTYPE html>
<html>
<head>
<title>CSS Test: flex-basis with calc() percentage (reference)</title>
<style>
  body { margin: 0; background: white; }
</style>
</head>
<body>
  <!--
    Reference: show two 190px boxes with a 20px gap using a flex container
    with explicit widths (no calc), matching what flex-basis:calc(50%-10px) produces.
    Container: 400px, gap: 20px → 190+20+190 = 400px
  -->
  <div style="display:flex; gap:20px; width:400px; height:100px; flex-wrap:nowrap;">
    <div style="flex:0 0 190px; height:100px; background:green;"></div>
    <div style="flex:0 0 190px; height:100px; background:blue;"></div>
  </div>
</body>
</html>
