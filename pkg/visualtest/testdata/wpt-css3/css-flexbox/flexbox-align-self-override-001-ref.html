<!DOCTYPE html>
<html>
<head>
<title>CSS Test: align-self overrides align-items (reference)</title>
<style>
  body { margin: 0; background: white; }
  .container {
    position: relative;
    width: 300px;
    height: 120px;
    background: white;
  }
  .item {
    position: absolute;
    width: 80px;
    height: 40px;
  }
  /* Item 1 (red): align-items: flex-start → top: 0 */
  .item1 { background: red;   left: 0;    top: 0; }
  /* Item 2 (green): align-self: center → top: (120-40)/2 = 40px */
  .item2 { background: green; left: 80px; top: 40px; }
  /* Item 3 (blue): align-self: flex-end → top: 120-40 = 80px */
  .item3 { background: blue;  left: 160px; top: 80px; }
</style>
</head>
<body>
  <div class="container">
    <div class="item item1"></div>
    <div class="item item2"></div>
    <div class="item item3"></div>
  </div>
</body>
</html>
