<!DOCTYPE html>
<html>
<head>
<title>CSS Test: flex gap shorthand property (reference)</title>
<style>
  body { margin: 0; background: white; }
  .container {
    display: flex;
    flex-wrap: wrap;
    width: 200px;
    background: white;
    /* Use explicit row-gap and column-gap instead of gap shorthand */
    row-gap: 20px;
    column-gap: 20px;
  }
  .item {
    flex: none;
    width: 80px;
    height: 80px;
  }
  .item:nth-child(1) { background: red; }
  .item:nth-child(2) { background: green; }
  .item:nth-child(3) { background: blue; }
  .item:nth-child(4) { background: yellow; }
</style>
</head>
<body>
  <div class="container">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
</body>
</html>
