<!DOCTYPE html>
<html>
<head>
<title>CSS Test: flex gap shorthand property</title>
<link rel="match" href="flexbox-gap-shorthand-001-ref.html">
<style>
  body { margin: 0; background: white; }
  .container {
    display: flex;
    flex-wrap: wrap;
    width: 200px;
    background: white;
    gap: 20px;
  }
  .item {
    flex: none;
    width: 80px;
    height: 80px;
  }
  .item:nth-child(1) { background: red; }
  .item:nth-child(2) { background: green; }
  .item:nth-child(3) { background: blue; }
  .item:nth-child(4) { background: yellow; }
</style>
</head>
<body>
  <!--
    gap: 20px sets both row-gap and column-gap to 20px.
    Container: 200px × 200px. Items: 80px × 80px each.
    Row 1: item1(0,0) gap(20px) item2(100,0) — 80+20+80=180 fits in 200px
    Row 2: item3(0,100) gap(20px) item4(100,100) — gap between rows = 20px → row starts at 80+20=100
  -->
  <div class="container">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
</body>
</html>
