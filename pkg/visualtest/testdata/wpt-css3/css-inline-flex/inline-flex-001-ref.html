<!DOCTYPE html>
<html>
<head>
  <title>Reference: inline-flex shrink-to-fit</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* 3 items × 50px = 150px wide, 80px tall */
    .box {
      width: 150px;
      height: 80px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
