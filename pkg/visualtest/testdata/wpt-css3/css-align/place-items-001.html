<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Test: place-items: center</title>
<link rel="match" href="place-items-001-ref.html">
<meta name="assert" content="place-items: center should center the grid item both horizontally and vertically.">
<style>
.grid {
  display: grid;
  width: 200px;
  height: 200px;
  border: 1px solid black;
  place-items: center;
}
.item {
  width: 50px;
  height: 50px;
  background: #008000;
}
</style>
<p>Test passes if a green square is centered inside a bordered box.</p>
<div class="grid">
  <div class="item"></div>
</div>
