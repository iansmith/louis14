<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Reference: place-self: end</title>
<style>
.grid {
  display: grid;
  width: 200px;
  height: 200px;
  border: 1px solid black;
}
.item {
  width: 50px;
  height: 50px;
  background: #008000;
  align-self: end;
  justify-self: end;
}
</style>
<p>Test passes if a green square is in the bottom-right corner of a bordered box.</p>
<div class="grid">
  <div class="item"></div>
</div>
