<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Reference: place-items: center</title>
<style>
.grid {
  display: grid;
  width: 200px;
  height: 200px;
  border: 1px solid black;
  align-items: center;
  justify-items: center;
}
.item {
  width: 50px;
  height: 50px;
  background: #008000;
}
</style>
<p>Test passes if a green square is centered inside a bordered box.</p>
<div class="grid">
  <div class="item"></div>
</div>
