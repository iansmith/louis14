<!DOCTYPE html>
<html>
<head>
  <title>CSS Reference: text with red marks above each character</title>
  <style>
    body { margin: 0; padding: 10px; font-family: Ahem; font-size: 16px; position: relative; }
    .mark { position: absolute; width: 8px; height: 8px; background: red; top: 9px; }
  </style>
</head>
<body>
<div class="mark" style="left: 14px;"></div>
<div class="mark" style="left: 30px;"></div>
<div class="mark" style="left: 46px;"></div>
<div class="mark" style="left: 62px;"></div>
<div class="mark" style="left: 78px;"></div>
<span>ABCDE</span>
</body>
</html>
