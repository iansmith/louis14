<!DOCTYPE html>
<html>
<head>
    <title>CSS Test: :has(.child) selector basic matching</title>
    <link rel="match" href="has-selector-basic-001-ref.html"/>
    <meta name="assert" content=":has(.child) matches a parent element that contains a child with class 'child'."/>
    <style>
        body { margin: 0; background: white; }
        .container:has(.child) {
            background: green;
            width: 200px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="container"><span class="child">Text</span></div>
</body>
</html>
