<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference: disc markers</title>
  <style>
    body { margin: 0; padding: 10px; font-size: 16px; font-family: Ahem; }
    ul { list-style-type: disc; padding-left: 40px; margin: 0; }
    li { margin: 0; }
  </style>
</head>
<body>
  <ul>
    <li>First item</li>
    <li>Second item</li>
    <li>Third item</li>
  </ul>
</body>
</html>
