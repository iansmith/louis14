<!DOCTYPE html>
<title>CSS display: contents flex reference</title>
<style>
  body { margin: 0; }
  .flex { display: flex; width: 300px; }
  .item { width: 100px; height: 100px; }
  .a { background: green; }
  .b { background: blue; }
  .c { background: lime; }
</style>
<div class="flex">
  <div class="item a"></div>
  <div class="item b"></div>
  <div class="item c"></div>
</div>
