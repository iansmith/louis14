<!DOCTYPE html>
<title>CSS text-shadow reference</title>
<style>
  body { margin: 0; }
  .shadow {
    position: absolute;
    top: 53px;
    left: 53px;
    font-size: 40px;
    font-family: serif;
    color: red;
  }
  .text {
    position: absolute;
    top: 50px;
    left: 50px;
    font-size: 40px;
    font-family: serif;
    color: black;
  }
</style>
<div class="shadow">Test</div>
<div class="text">Test</div>
