<!DOCTYPE html>
<html>
<head>
  <title>Reference: flex-wrap</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .item { width: 100px; height: 50px; }
    .green { background: green; }
    .blue { background: blue; }
  </style>
</head>
<body>
  <div style="width: 200px">
    <div style="display:flex">
      <div class="item green"></div>
      <div class="item green"></div>
    </div>
    <div style="display:flex">
      <div class="item blue"></div>
      <div class="item blue"></div>
    </div>
  </div>
</body>
</html>
