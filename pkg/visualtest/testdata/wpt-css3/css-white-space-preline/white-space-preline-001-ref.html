<!DOCTYPE html>
<html>
<head>
  <title>Reference: white-space pre-line</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; }
    /* Reference: explicit 2-line container matching the pre-line result.
       Uses BR to force a newline, which is equivalent to what pre-line
       produces from a literal newline in source. */
    .ref {
      width: 200px;
      background: green;
      color: green;
      font-size: 20px;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <div class="ref">AA<br>BB</div>
</body>
</html>
