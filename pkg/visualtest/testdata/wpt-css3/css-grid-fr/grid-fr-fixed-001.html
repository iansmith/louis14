<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: grid fr unit with fixed column</title>
  <link rel="match" href="grid-fr-fixed-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* 400px container: 200px fixed + 1fr (fills remaining 200px) */
    .grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      width: 400px;
    }
    .item { height: 100px; }
    .green { background: green; }
    .blue { background: blue; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="item green"></div>
    <div class="item blue"></div>
  </div>
</body>
</html>
