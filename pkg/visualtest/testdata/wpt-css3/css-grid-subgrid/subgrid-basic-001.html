<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: grid subgrid basic</title>
  <link rel="match" href="subgrid-basic-001-ref.html" />
  <style>
    body { margin: 0; }
    .outer {
      display: grid;
      grid-template-columns: 100px 100px;
      grid-template-rows: 100px;
      width: 200px;
      height: 100px;
    }
    .item1 { background: green; grid-column: 1; }
    .item2 { background: blue; grid-column: 2; }
  </style>
</head>
<body>
  <div class="outer">
    <div class="item1"></div>
    <div class="item2"></div>
  </div>
</body>
</html>
