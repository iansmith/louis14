<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: @layer statement form declares order</title>
  <link rel="match" href="layer-order-statement-001-ref.html" />
  <meta name="assert" content="@layer statement declares priority order: later names in the statement win" />
  <style>
    body { margin: 0; }
    /* Declare layer order: override is higher priority than base */
    @layer base, override;
    /* Override layer defined first in document (but declared second in @layer statement) */
    @layer override {
      div { background-color: blue; }
    }
    /* Base layer defined second in document (but declared first in @layer statement) */
    @layer base {
      div { background-color: red; }
    }
  </style>
</head>
<body>
  <div style="width: 100px; height: 100px;"></div>
</body>
</html>
