<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: margin:auto horizontal centering</title>
  <link rel="match" href="margin-auto-center-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .container {
      width: 400px;
    }
    /* 200px box centered in 400px container via auto margins
       Left margin = (400-200)/2 = 100px */
    .centered {
      width: 200px;
      height: 100px;
      margin: 0 auto;
      background: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="centered"></div>
  </div>
</body>
</html>
