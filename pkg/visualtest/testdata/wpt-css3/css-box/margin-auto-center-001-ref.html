<!DOCTYPE html>
<html>
<head>
  <title>Reference: margin:auto centering</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .container {
      width: 400px;
    }
    .centered {
      width: 200px;
      height: 100px;
      margin-left: 100px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="centered"></div>
  </div>
</body>
</html>
