<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: box-sizing: content-box is the default</title>
  <link rel="help" href="https://www.w3.org/TR/css-ui-3/#box-sizing" />
  <link rel="match" href="box-sizing-content-box-001-ref.html" />
  <meta name="assert" content="When box-sizing is content-box (default), the specified width is the content width only. Padding and border are added on top." />
  <style>
  .test {
    box-sizing: content-box;
    width: 100px;
    height: 100px;
    padding: 10px;
    border: 5px solid black;
    background: green;
  }
  </style>
</head>
<body>
  <p>Test passes if the bordered box total width is 130px.</p>
  <div class="test"></div>
</body>
</html>
