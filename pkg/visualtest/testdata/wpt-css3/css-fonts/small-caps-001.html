<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: font-variant-caps: small-caps with uppercase text</title>
  <link rel="match" href="reference/small-caps-001-ref.html"/>
  <meta name="assert" content="font-variant-caps: small-caps on already-uppercase text renders identically to plain text."/>
  <style>
    body { margin: 8px; font-family: serif; font-size: 16px; }
    .test { font-variant-caps: small-caps; }
  </style>
</head>
<body>
  <p class="test">HELLO WORLD</p>
</body>
</html>
