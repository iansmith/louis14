<!DOCTYPE html>
<title>CSS display: contents grid reference</title>
<style>
  body { margin: 0; }
  .grid { display: grid; grid-template-columns: 100px 100px; width: 200px; }
  .item { height: 50px; }
  .a { background: green; }
  .b { background: blue; }
  .c { background: lime; }
  .d { background: red; }
</style>
<div class="grid">
  <div class="item a"></div>
  <div class="item b"></div>
  <div class="item c"></div>
  <div class="item d"></div>
</div>
