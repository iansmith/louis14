<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference</title>
  <style>
    body { margin: 0; }
    .container {
      display: inline-block;
    }
    .test-closest {
      width: 100px;
      height: 100px;
      background: radial-gradient(50px circle at center, white, black);
    }
    .test-farthest {
      width: 100px;
      height: 100px;
      background: radial-gradient(circle farthest-corner at center, white, black);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="test-closest"></div>
  </div>
  <div class="container">
    <div class="test-farthest"></div>
  </div>
</body>
</html>
