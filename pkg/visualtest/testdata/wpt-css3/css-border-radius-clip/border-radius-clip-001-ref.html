<!DOCTYPE html>
<html>
<head>
  <title>Reference: border-radius clips child content</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 20px; }
    /* Same shape, just a single element with border-radius and green background */
    .card {
      width: 200px;
      height: 200px;
      border-radius: 50px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="card"></div>
</body>
</html>
