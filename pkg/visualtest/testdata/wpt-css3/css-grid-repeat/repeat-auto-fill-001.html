<!DOCTYPE html>
<html>
<head>
  <title>CSS Grid: repeat(auto-fill, 100px)</title>
  <link rel="match" href="repeat-auto-fill-001-ref.html">
  <style>
    body { margin: 0; }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 100px);
      grid-template-rows: 100px;
      width: 300px;
      height: 100px;
    }
    .cell {
      background-color: green;
    }
  </style>
</head>
<body>
<div id="grid">
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
</div>
</body>
</html>
