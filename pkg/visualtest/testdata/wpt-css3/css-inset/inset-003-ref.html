<!DOCTYPE html>
<title>CSS Test Reference: inset shorthand - zero</title>
<style>
  .container {
    position: relative;
    width: 100px;
    height: 100px;
    background: red;
  }
  .box {
    position: absolute;
    top: 0;
    left: 0;
    width: 100px;
    height: 100px;
    background: green;
  }
</style>
<div class="container">
  <div class="box"></div>
</div>
