<!DOCTYPE html>
<title>CSS inset reference</title>
<style>
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: red;
  }
  .box {
    position: absolute;
    top: 10px;
    right: 30px;
    bottom: 10px;
    left: 30px;
    background: green;
  }
</style>
<p>Test passes if the green box has 10px red on top/bottom and 30px red on left/right.</p>
<div class="container"><div class="box"></div></div>
