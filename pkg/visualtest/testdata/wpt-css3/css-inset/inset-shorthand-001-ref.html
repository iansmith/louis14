<!DOCTYPE html>
<title>CSS inset reference</title>
<style>
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: red;
  }
  .box {
    position: absolute;
    top: 20px;
    right: 20px;
    bottom: 20px;
    left: 20px;
    background: green;
  }
</style>
<p>Test passes if there is a green square inside a red border (20px on all sides).</p>
<div class="container"><div class="box"></div></div>
