<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: position:fixed places element relative to viewport</title>
  <link rel="match" href="position-fixed-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Fixed element at top-right corner of viewport */
    .fixed-header {
      position: fixed;
      top: 0;
      right: 0;
      width: 200px;
      height: 50px;
      background: green;
    }
    /* Fixed element at bottom-left */
    .fixed-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 300px;
      height: 40px;
      background: blue;
    }
  </style>
</head>
<body>
  <div class="fixed-header"></div>
  <div class="fixed-footer"></div>
</body>
</html>
