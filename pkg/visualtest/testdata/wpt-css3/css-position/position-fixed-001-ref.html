<!DOCTYPE html>
<html>
<head>
  <title>Reference: position:fixed</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Absolute positioning relative to viewport (same as fixed at scroll=0) */
    .header {
      position: absolute;
      top: 0;
      right: 0;
      width: 200px;
      height: 50px;
      background: green;
    }
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 300px;
      height: 40px;
      background: blue;
    }
  </style>
</head>
<body>
  <div class="header"></div>
  <div class="footer"></div>
</body>
</html>
