<!DOCTYPE html>
<html>
<head>
    <title>CSS Reftest Reference: sticky element pushed to left:30px</title>
    <style>
        body { margin: 0; background: white; width: 400px; }
        .container {
            position: relative;
            width: 400px;
            height: 100px;
        }
        /* Matches the visual of a sticky element pushed to x=30px:
           - 30px white gap at left (x=0..30, sticky's in-flow slot)
           - 50px green block (x=30..80, sticky's painted position)
           - Remaining white (x=80..400) */
        .spacer-left {
            display: inline-block;
            width: 30px;
            height: 50px;
        }
        .block {
            display: inline-block;
            background: green;
            height: 50px;
            width: 50px;
            vertical-align: top;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spacer-left"></div><div class="block"></div>
    </div>
</body>
</html>
