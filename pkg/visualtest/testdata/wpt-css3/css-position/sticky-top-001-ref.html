<!DOCTYPE html>
<html>
<head>
    <title>CSS Reftest Reference</title>
    <style>
        body { margin: 0; background: white; }
        .before {
            height: 50px;
            background: lightblue;
        }
        .sticky {
            height: 50px;
            background: green;
            color: white;
        }
        .after {
            height: 50px;
            background: lightcoral;
        }
    </style>
</head>
<body>
    <div class="before">Before</div>
    <div class="sticky">Sticky</div>
    <div class="after">After</div>
</body>
</html>
