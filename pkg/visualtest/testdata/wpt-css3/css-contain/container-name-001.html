<!DOCTYPE HTML>
<link rel="help" href="https://drafts.csswg.org/css-contain-3/#container-name">
<link rel="match" href="container-name-001-ref.html">
<style>
  .outer {
    container-type: inline-size;
    container-name: sidebar;
    width: 300px;
  }
  .child {
    background: red;
    width: 50px;
    height: 50px;
  }
  @container sidebar (min-width: 200px) {
    .child {
      background: green;
    }
  }
</style>
<div class="outer">
  <div class="child"></div>
</div>
