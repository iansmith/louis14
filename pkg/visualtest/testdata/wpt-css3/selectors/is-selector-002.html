<!DOCTYPE html>
<html>
<head>
<title>CSS selectors: :is() with element+class compound selectors</title>
<link rel="match" href="is-selector-002-ref.html">
<style>
  body { margin: 0; background: white; }
  /* div:is(.foo, .bar) should match divs that have class foo or bar */
  div:is(.foo, .bar) {
    background: green;
    width: 100px;
    height: 50px;
    display: block;
  }
  /* span:is(.foo) should NOT match (it's a span, not a div) — so no style from the rule above */
  span {
    display: block;
    width: 100px;
    height: 50px;
    background: blue;
  }
  .other {
    width: 100px;
    height: 50px;
    display: block;
    background: red;
  }
</style>
</head>
<body>
  <!-- Should be green: div with class foo -->
  <div class="foo"></div>
  <!-- Should be green: div with class bar -->
  <div class="bar"></div>
  <!-- Should be blue: span with class foo (element mismatch) -->
  <span class="foo"></span>
  <!-- Should be red: div with class other (no match) -->
  <div class="other"></div>
</body>
</html>
