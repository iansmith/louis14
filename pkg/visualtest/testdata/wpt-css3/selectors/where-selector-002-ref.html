<!DOCTYPE html>
<html>
<head>
<title>CSS selectors: :where() specificity reference</title>
<style>
  body { margin: 0; background: white; }
  .box {
    width: 100px;
    height: 50px;
    display: block;
  }
</style>
</head>
<body>
  <!-- green wins over :where() -->
  <div class="box" style="background: green;"></div>
  <!-- div element selector wins over :where() -->
  <div class="box" style="background: blue;"></div>
  <!-- :where() applies (only rule matching this span) -->
  <span class="box" style="background: red;"></span>
</body>
</html>
