<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 10px; background: white; }
div {
  display: block;
  width: 100px;
  height: 20px;
  margin: 2px 0;
}
div.a { background: red; }
div.b { background: red; }
div:not(.a):not(.b) { background: lime; }
</style>
</head>
<body>
<div class="a">a - red</div>
<div class="b">b - red</div>
<div>neither - lime</div>
</body>
</html>
