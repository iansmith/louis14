<!DOCTYPE html>
<html>
<head>
    <title>CSS Test: :first-of-type selects the first element of its type</title>
    <link rel="match" href="first-of-type-001-ref.html"/>
    <meta name="assert" content="span:first-of-type should style the first span element, even if it is not the first child."/>
    <style>
        body { margin: 0; background: white; }
        div { padding: 10px; }
        span:first-of-type { background: blue; color: white; }
    </style>
</head>
<body>
    <div><em>First em</em> <span>First span (blue)</span> <span>Second span</span></div>
</body>
</html>
