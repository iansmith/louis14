<!DOCTYPE html>
<html>
<head>
<link rel="match" href="not-selector-list-002-ref.html">
<style>
body { margin: 0; padding: 10px; background: white; }
div {
  display: block;
  width: 100px;
  height: 20px;
  background: red;
  margin: 2px 0;
}
/* Elements that are NOT .a AND NOT .b get lime */
div:not(.a, .b) {
  background: lime;
}
</style>
</head>
<body>
<div class="a">a - red</div>
<div class="b">b - red</div>
<div>neither - lime</div>
</body>
</html>
