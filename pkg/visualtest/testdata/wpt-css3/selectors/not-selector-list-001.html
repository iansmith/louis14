<!DOCTYPE html>
<html>
<head>
<link rel="match" href="not-selector-list-001-ref.html">
<style>
body { margin: 0; padding: 10px; background: white; }
div, p, span {
  display: block;
  width: 100px;
  height: 20px;
  background: red;
  margin: 2px 0;
}
/* :not(p, span) should match div but not p or span */
div:not(p, span) {
  background: lime;
}
</style>
</head>
<body>
<div>div - lime</div>
<p>p - red</p>
<span>span - red</span>
</body>
</html>
