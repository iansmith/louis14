<!DOCTYPE html>
<html>
<head>
    <title>CSS Test: :nth-of-type(2) selects the second element of its type</title>
    <link rel="match" href="nth-of-type-001-ref.html"/>
    <meta name="assert" content="p:nth-of-type(2) should style the second p element, not the second child overall."/>
    <style>
        body { margin: 0; background: white; }
        p { margin: 0; height: 50px; }
        p:nth-of-type(2) { background: green; }
    </style>
</head>
<body>
    <div>
        <span style="display:block;height:50px">Span (not a p)</span>
        <p>First p</p>
        <p>Second p (should be green)</p>
    </div>
</body>
</html>
