<!DOCTYPE html>
<title>CSS selectors: :is() pseudo-class</title>
<link rel="match" href="is-selector-001-ref.html">
<style>
  :is(.a, .b) {
    background: green;
    width: 100px;
    height: 50px;
  }
  .c {
    background: red;
    width: 100px;
    height: 50px;
  }
</style>
<p>Test passes if there are two green rectangles and one red rectangle.</p>
<div class="a"></div>
<div class="b"></div>
<div class="c"></div>
