<!DOCTYPE html>
<html>
<head>
<title>CSS selectors: :where() with multiple selectors preserves zero specificity</title>
<link rel="match" href="where-selector-002-ref.html">
<style>
  body { margin: 0; background: white; }
  .box {
    width: 100px;
    height: 50px;
    display: block;
  }
  /* :where() with a complex argument list — all have zero specificity */
  :where(.a, .b, .c) {
    background: red;
  }
  /* A simple class selector (specificity 0,1,0) beats :where() (specificity 0,0,0) */
  .green {
    background: green;
  }
  /* An element selector (specificity 0,0,1) also beats :where() (specificity 0,0,0) */
  div {
    background: blue;
  }
</style>
</head>
<body>
  <!-- .green beats :where(.a) — should render green -->
  <div class="box a green"></div>
  <!-- div beats :where(.b) — should render blue -->
  <div class="box b"></div>
  <!-- No other rule — :where(.c) applies — should render red -->
  <span class="box c"></span>
</body>
</html>
