<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: text-align start equals left for LTR content</title>
  <link rel="help" href="https://drafts.csswg.org/css-text-3/#propdef-text-align" />
  <link rel="match" href="text-align-start-001-ref.html" />
  <link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
  <meta name="assert" content="text-align:start in LTR context aligns text to the left, matching text-align:left." />
  <style>
  div {
    width: 160px;
    font: 16px/20px Ahem;
    background: lime;
    text-align: start;
  }
  </style>
</head>
<body style="margin:0;padding:0">
  <div>XXXX</div>
</body>
</html>
