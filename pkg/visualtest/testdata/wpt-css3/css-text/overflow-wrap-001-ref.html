<!DOCTYPE html>
<html>
<head>
  <title>Reference: overflow-wrap break-word</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Same text broken at character boundaries within 100px.
       Text is hidden (green on green) — only box height matters. */
    .box {
      width: 100px;
      overflow-wrap: break-word;
      background: green;
      color: green;
      font-size: 16px;
      line-height: 19px;
    }
  </style>
</head>
<body>
  <div class="box">ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
</body>
</html>
