<!DOCTYPE html>
<html>
<head>
  <title>Reference: letter-spacing</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Three 25px green squares in a row: char, gap, char
       Ahem renders each glyph as a filled square of 1em.
       letter-spacing adds space AFTER each character (except the last). */
    .container {
      height: 25px;
    }
    .char {
      display: inline-block;
      width: 25px;
      height: 25px;
      background: green;
    }
    .gap {
      display: inline-block;
      width: 25px;
      height: 25px;
    }
  </style>
</head>
<body>
  <div class="container"><div class="char"></div><div class="gap"></div><div class="char"></div></div>
</body>
</html>
