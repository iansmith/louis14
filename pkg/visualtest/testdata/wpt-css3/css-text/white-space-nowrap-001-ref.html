<!DOCTYPE html>
<html>
<head>
  <title>Reference: white-space nowrap</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; }
    /* Reference: same box dimensions but text fits naturally on one line.
       The green box is 60px wide and 20px tall (one line). */
    .ref {
      width: 60px;
      height: 20px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="ref"></div>
</body>
</html>
