<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: letter-spacing increases space between characters</title>
  <link rel="match" href="letter-spacing-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Ahem font: each character is exactly 1em wide.
       "XX" at 25px = 50px wide normally.
       With letter-spacing: 25px, total = 25 + 25 + 25 = 75px
       (2 chars at 25px each + 1 inter-char gap of 25px) */
    .test {
      font: 25px/1 Ahem;
      color: green;
      letter-spacing: 25px;
    }
  </style>
</head>
<body>
  <div class="test">XX</div>
</body>
</html>
