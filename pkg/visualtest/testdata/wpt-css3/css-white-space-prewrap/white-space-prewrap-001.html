<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: white-space pre-wrap preserves multiple spaces</title>
  <link rel="help" href="https://drafts.csswg.org/css-text-3/#white-space-property" />
  <link rel="match" href="white-space-prewrap-001-ref.html" />
  <link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
  <meta name="assert" content="white-space:pre-wrap preserves multiple consecutive spaces, so 'X  X' (4 chars at 16px = 64px) matches the reference." />
  <style>
  div {
    width: 200px;
    font: 16px/20px Ahem;
    background: lime;
    white-space: pre-wrap;
  }
  </style>
</head>
<body style="margin:0;padding:0">
  <div>X  X</div>
</body>
</html>
