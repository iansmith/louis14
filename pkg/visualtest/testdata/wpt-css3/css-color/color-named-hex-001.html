<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: named colors match hex equivalents</title>
  <link rel="match" href="color-named-hex-001-ref.html" />
  <meta name="assert" content="Named CSS colors resolve to their correct hex equivalents" />
  <style>
    body { margin: 0; }
    div { width: 100px; height: 25px; }
    .a { background: red; }
    .b { background: lime; }
    .c { background: blue; }
    .d { background: yellow; }
  </style>
</head>
<body>
  <div class="a"></div>
  <div class="b"></div>
  <div class="c"></div>
  <div class="d"></div>
</body>
</html>
