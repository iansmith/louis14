<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference: display-p3(1,0,0) gamut-mapped to sRGB</title>
  <!--
    Updated 2026-05-26 (C41): the previous reference value `rgb(255, 0, 0)`
    encoded naive per-channel clipping. CSS Color 4 §13.3 mandates OkLCh
    chroma-reduction gamut mapping for out-of-gamut wide-gamut sources, which
    matches Blink (`color.cc::IsBakedGamutMappingEnabled()`) and the WPT
    `lch-008` / `oklch-008` reftests in this directory. Updated to the
    spec-correct mapped value so this synthetic louis14-local test agrees
    with both spec and real browsers.
  -->
  <style>
    body { margin: 0; }
    .box { width: 100px; height: 100px; background: rgb(255, 52, 41); }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
