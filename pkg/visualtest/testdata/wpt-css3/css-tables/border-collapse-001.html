<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: border-collapse collapse</title>
  <link rel="match" href="border-collapse-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* 2×2 table with border-collapse: each cell 100×50.
       With collapse, adjacent borders merge to a single 2px border.
       Total width = 200 + 2px(left) + 2px(right) + 2px(middle) = 206px
       Total height = 100 + 2px(top) + 2px(bottom) + 2px(middle) = 106px
       Just test the cells have green background and are adjacent. */
    table {
      border-collapse: collapse;
    }
    td {
      width: 100px;
      height: 50px;
      background: green;
      border: 2px solid green;
      padding: 0;
    }
  </style>
</head>
<body>
  <table>
    <tr><td></td><td></td></tr>
    <tr><td></td><td></td></tr>
  </table>
</body>
</html>
