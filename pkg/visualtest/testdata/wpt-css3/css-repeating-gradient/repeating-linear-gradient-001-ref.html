<!DOCTYPE html>
<html>
<head>
    <title>CSS Reftest Reference</title>
    <style>
        body { margin: 0; background: white; }
        .box {
            width: 200px;
            height: 200px;
            overflow: hidden;
        }
        .stripe {
            height: 20px;
        }
        .g { background: green; }
        .w { background: white; }
    </style>
</head>
<body>
    <div class="box">
        <div class="stripe g"></div>
        <div class="stripe w"></div>
        <div class="stripe g"></div>
        <div class="stripe w"></div>
        <div class="stripe g"></div>
        <div class="stripe w"></div>
        <div class="stripe g"></div>
        <div class="stripe w"></div>
        <div class="stripe g"></div>
        <div class="stripe w"></div>
    </div>
</body>
</html>
