<!DOCTYPE html>
<html>
<head>
    <title>CSS Test: repeating-radial-gradient creates concentric circles</title>
    <link rel="match" href="repeating-radial-gradient-001-ref.html"/>
    <meta name="assert" content="repeating-radial-gradient should produce the same result as a non-repeating radial-gradient with manually expanded stops."/>
    <style>
        body { margin: 0; background: white; }
        .box {
            width: 200px;
            height: 200px;
            background: repeating-radial-gradient(circle at center, green 0px, green 20px, lime 20px, lime 40px);
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
