<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: background-size with explicit dimensions</title>
  <link rel="match" href="background-size-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* A solid-color gradient constrained to 200x100 in a 400x200 container.
       Should produce a 200x100 green rectangle in the top-left corner. */
    .box {
      width: 400px;
      height: 200px;
      background-image: linear-gradient(green, green);
      background-size: 200px 100px;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
