<!DOCTYPE html>
<html>
<head>
  <title>Reference: background-position</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .outer {
      position: relative;
      width: 200px;
      height: 200px;
    }
    .inner {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 100px;
      height: 100px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="inner"></div>
  </div>
</body>
</html>
