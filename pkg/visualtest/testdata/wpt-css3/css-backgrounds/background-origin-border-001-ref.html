<!DOCTYPE html>
<html>
<head>
  <title>CSS Reftest Reference: background-origin border-box</title>
</head>
<body style="margin:0;padding:0;background:white">
  <!-- Reference: a box 80x80 with left half blue, right half lime.
       This represents the gradient filling the full border-box when background-origin:border-box. -->
  <div style="width:80px;height:80px;overflow:hidden">
    <div style="float:left;width:40px;height:80px;background:blue"></div>
    <div style="float:left;width:40px;height:80px;background:lime"></div>
  </div>
</body>
</html>
