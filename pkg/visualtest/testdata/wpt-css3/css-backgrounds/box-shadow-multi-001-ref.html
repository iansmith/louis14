<!DOCTYPE html>
<html>
<head>
  <title>Reference: multiple box shadows</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 10px; }
    .container { position: relative; }
    .shadow1 { position: absolute; left: 60px; top: 0; width: 50px; height: 50px; background: red; }
    .shadow2 { position: absolute; left: 0; top: 60px; width: 50px; height: 50px; background: blue; }
    .element { position: absolute; left: 0; top: 0; width: 50px; height: 50px; background: green; }
  </style>
</head>
<body>
  <div class="container">
    <div class="shadow2"></div>
    <div class="shadow1"></div>
    <div class="element"></div>
  </div>
</body>
</html>
