<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference</title>
  <style>
    body { margin: 0; padding: 20px; }
    .container { position: relative; width: 90px; height: 90px; }
    .shadow {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 80px;
      height: 80px;
      background: green;
    }
    .box {
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      background: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shadow"></div>
    <div class="box"></div>
  </div>
</body>
</html>
