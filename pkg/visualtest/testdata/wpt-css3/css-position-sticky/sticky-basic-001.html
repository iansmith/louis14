<!DOCTYPE html>
<html>
<head>
    <title>CSS Test: position:sticky at scroll=0 behaves like normal flow</title>
    <link rel="match" href="sticky-basic-001-ref.html"/>
    <meta name="assert" content="A sticky element at scroll position 0 should appear in its normal flow position, same as a static element."/>
    <style>
        body { margin: 0; background: white; }
        .header {
            position: sticky;
            top: 0;
            background: green;
            height: 50px;
            width: 100%;
            color: white;
        }
        .content {
            height: 100px;
            background: lightgray;
        }
    </style>
</head>
<body>
    <div class="header">Sticky Header</div>
    <div class="content">Content</div>
</body>
</html>
