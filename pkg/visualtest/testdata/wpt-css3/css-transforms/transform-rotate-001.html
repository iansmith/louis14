<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: transform rotate(180deg) flips element</title>
  <link rel="help" href="http://www.w3.org/TR/css-transforms-1/#funcdef-rotate" />
  <link rel="match" href="transform-rotate-001-ref.html" />
  <meta name="assert" content="rotate(180deg) visually flips an element 180 degrees around its center" />
  <style>
  .container {
    width: 100px;
    height: 100px;
    overflow: hidden;
  }
  .box {
    width: 100px;
    height: 100px;
    transform: rotate(180deg);
  }
  .top { height: 50px; background: green; }
  .bottom { height: 50px; background: blue; }
  </style>
</head>
<body>
  <p>Test passes if the blue half is on top and green half is on bottom.</p>
  <div class="container">
    <div class="box">
      <div class="top"></div>
      <div class="bottom"></div>
    </div>
  </div>
</body>
</html>
