<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference: transform matrix translate</title>
  <style>
  body { margin: 0; }
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: white;
    overflow: hidden;
  }
  .box {
    position: absolute;
    left: 50px;
    top: 50px;
    width: 60px;
    height: 60px;
    background: green;
  }
  </style>
</head>
<body>
  <div class="container">
    <div class="box"></div>
  </div>
</body>
</html>
