<!DOCTYPE html>
<title>CSS transform: skewX(45deg) reference using clip-path polygon</title>
<style>
  body { margin: 0; }
  /* skewX(45deg) about transform-origin 0 100% maps x' = x + tan(45deg)*(y - 100):
     the bottom edge (y=100) stays at x=0..100 and the top edge (y=0) moves
     100px LEFT to x=-100..0. Corners: (-100,0) (0,0) (100,100) (0,100).
     Verified in Chrome 152.0.7977.167: getBoundingClientRect() of the test
     box is left=-100 top=0 right=100 bottom=100, computed transform
     matrix(1, 0, 1, 1, 0, 0). The part left of x=0 is off-page. */
  div {
    width: 200px;
    height: 100px;
    margin-left: -100px;
    background: green;
    clip-path: polygon(0 0, 100px 0, 200px 100px, 100px 100px);
  }
</style>
<div></div>
