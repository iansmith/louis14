<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference</title>
  <style>
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: white;
    overflow: hidden;
  }
  .box {
    position: absolute;
    left: 25px;
    top: 25px;
    width: 100px;
    height: 100px;
    background: green;
  }
  </style>
</head>
<body>
  <p>Test passes if there is a 100x100 green square centered at (75,75).</p>
  <div class="container">
    <div class="box"></div>
  </div>
</body>
</html>
