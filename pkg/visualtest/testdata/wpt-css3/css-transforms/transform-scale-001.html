<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: transform scale doubles element size</title>
  <link rel="help" href="http://www.w3.org/TR/css-transforms-1/#funcdef-scale" />
  <link rel="match" href="transform-scale-001-ref.html" />
  <meta name="assert" content="scale(2) visually doubles the size of an element from its center" />
  <style>
  .container {
    width: 200px;
    height: 200px;
    background: white;
    overflow: hidden;
  }
  .box {
    width: 50px;
    height: 50px;
    margin-left: 50px;
    margin-top: 50px;
    background: green;
    transform: scale(2);
  }
  </style>
</head>
<body>
  <p>Test passes if there is a 100x100 green square centered at (75,75).</p>
  <div class="container">
    <div class="box"></div>
  </div>
</body>
</html>
