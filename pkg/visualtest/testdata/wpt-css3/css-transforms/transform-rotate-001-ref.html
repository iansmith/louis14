<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference</title>
  <style>
  .container {
    width: 100px;
    height: 100px;
  }
  .top { height: 50px; background: blue; }
  .bottom { height: 50px; background: green; }
  </style>
</head>
<body>
  <p>Test passes if the blue half is on top and green half is on bottom.</p>
  <div class="container">
    <div class="top"></div>
    <div class="bottom"></div>
  </div>
</body>
</html>
