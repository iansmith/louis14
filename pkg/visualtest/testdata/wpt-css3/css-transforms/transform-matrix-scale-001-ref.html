<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference: matrix rotation = rotate(90deg)</title>
  <style>
  body { margin: 0; }
  .container {
    width: 100px;
    height: 100px;
    overflow: hidden;
  }
  .box {
    width: 100px;
    height: 100px;
    transform: rotate(90deg);
  }
  .top { height: 50px; background: green; }
  .bottom { height: 50px; background: blue; }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <div class="top"></div>
      <div class="bottom"></div>
    </div>
  </div>
</body>
</html>
