<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference</title>
  <style>
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: white;
  }
  .box {
    position: absolute;
    left: 50px;
    top: 50px;
    width: 50px;
    height: 50px;
    background: green;
  }
  </style>
</head>
<body>
  <p>Test passes if the green square is positioned 50px from the top-left corner.</p>
  <div class="container">
    <div class="box"></div>
  </div>
</body>
</html>
