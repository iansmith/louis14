<!DOCTYPE html>
<title>CSS transform: skewX(45deg) shifts the top edge left</title>
<link rel="match" href="skew-transform-visual-001-ref.html">
<style>
  body { margin: 0; }
  /* A 100x100 green box skewed 45deg on X axis about its bottom-left
     corner: x' = x + tan(45deg)*(y - 100). The bottom edge stays put and
     the top edge shifts LEFT by 100px: top-left (0,0) -> (-100,0).
     We compare against a polygon reference. */
  div {
    width: 100px;
    height: 100px;
    background: green;
    transform-origin: 0 100%;
    transform: skewX(45deg);
  }
</style>
