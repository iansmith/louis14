<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: grid auto-placement with implicit rows</title>
  <link rel="match" href="grid-autoflow-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* 3-column grid with 5 items: row 1 gets 3, row 2 gets 2 (auto-placed) */
    .grid {
      display: grid;
      grid-template-columns: 100px 100px 100px;
      width: 300px;
    }
    .item { height: 50px; }
    .green { background: green; }
    .blue { background: blue; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="item green"></div>
    <div class="item green"></div>
    <div class="item green"></div>
    <div class="item blue"></div>
    <div class="item blue"></div>
  </div>
</body>
</html>
