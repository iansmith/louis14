<!DOCTYPE html>
<html>
<head>
  <title>Reference: opacity on children</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: white; }
    /* green (#008000) at 50% opacity on white (#ffffff):
       R: 255 * 0.5 + 0 * 0.5 = 128 (0x80)
       G: 255 * 0.5 + 128 * 0.5 = 192 (0xC0)
       B: 255 * 0.5 + 0 * 0.5 = 128 (0x80)
       → rgb(128, 192, 128) = #80C080 */
    .child {
      width: 200px;
      height: 100px;
      background: rgb(128, 192, 128);
    }
  </style>
</head>
<body>
  <div class="child"></div>
</body>
</html>
