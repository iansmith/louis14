<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: :enabled pseudo-class on enabled input</title>
  <link rel="author" title="Louis14 Project" href="https://github.com/nicholasgasior/louis14"/>
  <link rel="help" href="https://www.w3.org/TR/selectors-4/#enableddisabled"/>
  <link rel="match" href="enabled-001-ref.html"/>
  <meta name="assert" content="The :enabled pseudo-class should match an input element that is not disabled."/>
  <style type="text/css">
    body { margin: 0; background: white; }
    input:enabled {
      background: green;
      width: 200px;
      height: 40px;
      border: 2px solid black;
    }
  </style>
</head>
<body>
  <p>Test passes if there is a green input box with a black border.</p>
  <input type="text" value="Enabled"/>
</body>
</html>
