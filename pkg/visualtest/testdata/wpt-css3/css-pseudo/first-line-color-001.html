<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: ::first-line color property</title>
  <link rel="author" title="Louis14 Project" href="https://github.com/nicholasgasior/louis14"/>
  <link rel="help" href="https://www.w3.org/TR/css-pseudo-4/#first-line-pseudo"/>
  <link rel="match" href="first-line-color-001-ref.html"/>
  <meta name="assert" content="The ::first-line pseudo-element should apply the color property to the first line. With a single line of text, ::first-line applies to all text."/>
  <style type="text/css">
    body { margin: 0; background: white; }
    p {
      margin: 0;
    }
    p::first-line {
      color: green;
    }
  </style>
</head>
<body>
  <p>This is green text</p>
</body>
</html>
