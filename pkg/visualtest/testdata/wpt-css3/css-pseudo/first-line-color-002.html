<!DOCTYPE html>
<title>CSS ::first-line applies color only to first formatted line</title>
<link rel="match" href="first-line-color-002-ref.html">
<style>
  body { margin: 0; }
  div {
    width: 160px;
    font: 16px/20px Ahem;
    color: red;
  }
  div::first-line {
    color: green;
  }
</style>
<!-- "XXXXXXXXXX XXXXXXXXXX" = 10*16+16+10*16 = 336px > 160px.
     Line 1: "XXXXXXXXXX" in green (first-line).
     Line 2: "XXXXXXXXXX" in red (not first-line). -->
<div>XXXXXXXXXX XXXXXXXXXX</div>
