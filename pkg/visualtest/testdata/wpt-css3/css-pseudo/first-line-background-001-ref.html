<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: ::first-line background-color - reference</title>
  <link rel="author" title="Louis14 Project" href="https://github.com/nicholasgasior/louis14"/>
  <style type="text/css">
    body { margin: 0; background: white; }
    p {
      margin: 0;
      font-size: 20px;
    }
    /* The ::first-line generated box behaves like an inline-level element
       (CSS Pseudo-4 §first-line-styling), so its background covers the line's
       text content, not the full block width — matching the genuine WPT
       first-line-line-height-00{1,2} and first-line-and-marker references,
       which all model ::first-line as an inline <span>. */
    span {
      background-color: green;
      color: white;
    }
  </style>
</head>
<body>
  <p><span>Green background line</span></p>
</body>
</html>
