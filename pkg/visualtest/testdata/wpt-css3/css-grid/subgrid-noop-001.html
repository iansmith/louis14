<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: grid-template-columns subgrid no-crash</title>
  <link rel="match" href="subgrid-noop-001-ref.html" />
  <style>
    body { margin: 0; }
    .outer {
      display: grid;
      grid-template-columns: 100px 100px;
      width: 200px;
    }
    .inner {
      grid-column: 1 / 3;
      display: grid;
      grid-template-columns: subgrid;
      background: green;
      height: 100px;
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="inner"></div>
  </div>
</body>
</html>
