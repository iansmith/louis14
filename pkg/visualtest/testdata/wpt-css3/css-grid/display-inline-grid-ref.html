<!DOCTYPE HTML>
<html>
<head>
  <title>CSS Grid Layout: Reference File</title>
  <style type="text/css">
    #container {
      position:relative;
    }
    #color-block {
      display:inline-block;
      width:400px;
      height:100px;
      vertical-align:top;
    }
    span {
      vertical-align:top;
    }
  </style>
</head>
<body>
<p>Test passes if there are 4 green rectangles and no red.</p>

<div id="container">
  <div id="color-block">
    <div style="width:100px;height:70px;background-color:green;float:left">cell1</div>
    <div style="width:300px;height:70px;background-color:limegreen;float:left">cell2</div>
    <div style="width:100px;height:30px;background-color:limegreen;float:left;clear:left">cell3</div>
    <div style="width:300px;height:30px;background-color:green;float:left">cell4</div>
  </div>
  <span>Inline</span>
</div>
</body>
</html>
