<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Test: grid-auto-flow: column</title>
<link rel="match" href="grid-auto-flow-column-001-ref.html">
<meta name="assert" content="grid-auto-flow: column should place items down columns first before creating new columns.">
<style>
.grid {
  display: grid;
  grid-template-rows: 50px 50px;
  grid-auto-flow: column;
  width: 200px;
  border: 1px solid black;
}
.grid > div {
  background: #008000;
  border: 1px solid white;
}
</style>
<p>Test passes if four green cells are arranged in a 2-row grid, filling columns first (A/B down, then C/D down).</p>
<div class="grid">
  <div>A</div>
  <div>B</div>
  <div>C</div>
  <div>D</div>
</div>
