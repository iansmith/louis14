<!DOCTYPE html>
<html>
<head>
  <title>CSS Grid: repeat(3, 100px) - Reference</title>
  <style>
    body { margin: 0; }
    #container {
      position: relative;
      width: 300px;
      height: 100px;
    }
    .cell {
      position: absolute;
      width: 100px;
      height: 100px;
      background-color: green;
    }
    #cell1 { left: 0; top: 0; }
    #cell2 { left: 100px; top: 0; }
    #cell3 { left: 200px; top: 0; }
  </style>
</head>
<body>
<div id="container">
  <div class="cell" id="cell1"></div>
  <div class="cell" id="cell2"></div>
  <div class="cell" id="cell3"></div>
</div>
</body>
</html>
