<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: grid-template-areas places items by name</title>
  <link rel="help" href="https://drafts.csswg.org/css-grid-1/#grid-template-areas-property" />
  <link rel="match" href="grid-template-areas-001-ref.html" />
  <meta name="assert" content="grid-template-areas defines named regions; items placed by grid-area match reference layout with green on left, lime on right." />
  <style>
  .grid {
    display: grid;
    width: 200px;
    height: 100px;
    grid-template-columns: 100px 100px;
    grid-template-rows: 100px;
    grid-template-areas: "left right";
  }
  .left  { grid-area: left;  background: green; }
  .right { grid-area: right; background: lime; }
  </style>
</head>
<body style="margin:0;padding:0">
  <div class="grid">
    <div class="right"></div>
    <div class="left"></div>
  </div>
</body>
</html>
