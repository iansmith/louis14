<!DOCTYPE html>
<html>
<head>
  <title>Reference: grid auto-placement</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .row { display: flex; }
    .item { width: 100px; height: 50px; }
    .green { background: green; }
    .blue { background: blue; }
  </style>
</head>
<body>
  <div>
    <div class="row">
      <div class="item green"></div>
      <div class="item green"></div>
      <div class="item green"></div>
    </div>
    <div class="row">
      <div class="item blue"></div>
      <div class="item blue"></div>
    </div>
  </div>
</body>
</html>
