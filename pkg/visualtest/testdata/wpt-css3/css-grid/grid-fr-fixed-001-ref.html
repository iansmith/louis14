<!DOCTYPE html>
<html>
<head>
  <title>Reference: grid fr unit with fixed column</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .row { display: flex; }
    .item { height: 100px; }
    .green { background: green; width: 200px; }
    .blue { background: blue; width: 200px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="item green"></div>
    <div class="item blue"></div>
  </div>
</body>
</html>
