<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Layout Reference: explicit placement</title>
<style>
body { margin: 0; padding: 0; }
.wrapper {
  position: relative;
  width: 300px;
  height: 200px;
  background: red;
}
.a { position: absolute; left: 0;   top: 0;   width: 100px; height: 100px; background: green; }
.b { position: absolute; left: 200px; top: 0; width: 100px; height: 100px; background: lime; }
.c { position: absolute; left: 100px; top: 100px; width: 100px; height: 100px; background: blue; }
</style>
<p>Test passes if there is a green square at top-left, a lime square at top-right, a blue square at bottom-center, and red is visible at top-center and bottom left/right.</p>
<div class="wrapper">
  <div class="a"></div>
  <div class="b"></div>
  <div class="c"></div>
</div>
