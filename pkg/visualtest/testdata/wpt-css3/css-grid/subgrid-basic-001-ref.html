<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference</title>
  <style>
    body { margin: 0; }
    .outer { position: relative; width: 200px; height: 100px; }
    .item1 { position: absolute; left: 0; top: 0; width: 100px; height: 100px; background: green; }
    .item2 { position: absolute; left: 100px; top: 0; width: 100px; height: 100px; background: blue; }
  </style>
</head>
<body>
  <div class="outer">
    <div class="item1"></div>
    <div class="item2"></div>
  </div>
</body>
</html>
