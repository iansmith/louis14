<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference: color(srgb 0 0.502 0) = rgb(0, 128, 0)</title>
  <style>
    body { margin: 0; }
    /* color(srgb 0 0.502 0): 0.502 * 255 + 0.5 = 128.51 -> 128 */
    .box { width: 100px; height: 100px; background: rgb(0, 128, 0); }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
