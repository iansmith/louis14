<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference: blue at 50% alpha over white = rgb(128, 128, 255)</title>
  <style>
    body { margin: 0; background: white; }
    /* color(srgb 0 0 1 / 0.5) = rgba(0, 0, 255, 0.5) over white = rgb(128, 128, 255) */
    .box { width: 100px; height: 100px; background: rgba(0, 0, 255, 0.5); }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
