<!DOCTYPE html>
<title>CSS inset: two-value shorthand</title>
<link rel="match" href="inset-values-001-ref.html">
<style>
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: red;
  }
  .box {
    position: absolute;
    inset: 10px 30px;
    width: 60px;
    height: 60px;
    background: green;
  }
</style>
<div class="container"><div class="box"></div></div>
