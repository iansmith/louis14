<!DOCTYPE html>
<title>CSS logical properties reference: inset shorthand</title>
<style>
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: red;
  }
  .box {
    position: absolute;
    top: 20px;
    right: 20px;
    bottom: 20px;
    left: 20px;
    background: lime;
  }
</style>
<p>Test passes if the lime box is inset 20px from all sides of the red container.</p>
<div class="container"><div class="box"></div></div>
