<!DOCTYPE html>
<title>CSS inset reference</title>
<style>
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: red;
  }
  .box {
    position: absolute;
    top: 10px;
    left: 30px;
    width: 60px;
    height: 60px;
    background: green;
  }
</style>
<div class="container"><div class="box"></div></div>
