<!DOCTYPE html>
<title>CSS logical properties: inset shorthand</title>
<link rel="match" href="logical-inset-001-ref.html">
<style>
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: red;
  }
  .box {
    position: absolute;
    inset: 20px;
    background: lime;
  }
</style>
<p>Test passes if the lime box is inset 20px from all sides of the red container.</p>
<div class="container"><div class="box"></div></div>
