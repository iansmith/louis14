<!DOCTYPE html>
<title>CSS Test: inset shorthand - two values</title>
<link rel="match" href="inset-002-ref.html">
<style>
  .container {
    position: relative;
    width: 200px;
    height: 200px;
    background: red;
  }
  .box {
    position: absolute;
    inset: 10px 30px;
    width: 50px;
    height: 50px;
    background: green;
  }
</style>
<div class="container">
  <div class="box"></div>
</div>
