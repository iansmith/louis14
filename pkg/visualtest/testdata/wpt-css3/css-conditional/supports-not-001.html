<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: @supports not with unsupported value</title>
  <link rel="author" title="Louis14 Project" href="https://github.com/nicholasgasior/louis14"/>
  <link rel="help" href="https://www.w3.org/TR/css-conditional-3/#at-supports"/>
  <link rel="match" href="supports-not-001-ref.html"/>
  <meta name="assert" content="@supports not (display: nonexistent) should apply its rules because 'nonexistent' is not a valid display value."/>
  <style type="text/css">
    body { margin: 0; background: white; }
    .box {
      width: 200px;
      height: 100px;
      background: red;
    }
    @supports not (display: nonexistent) {
      .box {
        background: green;
      }
    }
  </style>
</head>
<body>
  <p>Test passes if there is a green rectangle and no red.</p>
  <div class="box"></div>
</body>
</html>
