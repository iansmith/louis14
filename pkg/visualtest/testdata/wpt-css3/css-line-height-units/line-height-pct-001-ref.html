<!DOCTYPE html>
<html>
<head>
  <title>Reference: line-height percentage</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; }
    /* Reference: explicit 30px green box matching line-height:150% at 20px font-size */
    .ref {
      width: 100px;
      height: 30px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="ref"></div>
</body>
</html>
