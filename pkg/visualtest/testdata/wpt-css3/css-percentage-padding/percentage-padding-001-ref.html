<!DOCTYPE html>
<html>
<head>
  <title>Reference: Percentage padding</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .container {
      width: 200px;
    }
    /* 50% of 200px = 100px padding-top, rendered as a green block */
    .box {
      height: 100px;
      background: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box"></div>
  </div>
</body>
</html>
