<!DOCTYPE html>
<html>
<head>
  <title>Reference: column-span: none (default)</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Two lime blocks side by side in 2 columns — total 400px x 50px lime bar */
    .container { display: flex; width: 400px; }
    .block { width: 200px; height: 50px; background: lime; }
  </style>
</head>
<body>
  <div class="container">
    <div class="block"></div>
    <div class="block"></div>
  </div>
</body>
</html>
