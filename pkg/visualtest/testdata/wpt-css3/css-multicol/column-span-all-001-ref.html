<!DOCTYPE html>
<html>
<head>
  <title>Reference: column-span: all</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Local (non-upstream) reference. Geometry measured in Chrome 159
       (getClientRects): each 50px column-content block before/after the
       spanner is balanced across both 200px columns as 25px fragments;
       the spanner sits between the two column rows; multicol is 70px tall. */
    .container { position: relative; width: 400px; height: 70px; }
    .container > div { position: absolute; }
    .green { top: 0; height: 25px; width: 200px; background: green; }
    .blue  { left: 0; top: 25px; width: 400px; height: 20px; background: blue; }
    .red   { top: 45px; height: 25px; width: 200px; background: red; }
    .c1 { left: 0; }
    .c2 { left: 200px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="green c1"></div>
    <div class="green c2"></div>
    <div class="blue"></div>
    <div class="red c1"></div>
    <div class="red c2"></div>
  </div>
</body>
</html>
