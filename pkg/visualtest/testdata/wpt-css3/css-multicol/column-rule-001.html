<!DOCTYPE html>
<title>CSS column-rule draws line between columns</title>
<link rel="match" href="column-rule-001-ref.html">
<style>
  body { margin: 0; }
  div {
    width: 200px;
    column-count: 2;
    column-gap: 0;
    column-rule: 4px solid green;
    font: 16px/20px Ahem;
    height: 20px;
  }
</style>
<!-- Two 100px columns with a 4px green rule between them.
     The rule is centered in the column-gap (which is 0, so the rule
     overlaps the content area by 2px on each side at x=98..102). -->
<div>XXXXXX XXXXXX</div>
