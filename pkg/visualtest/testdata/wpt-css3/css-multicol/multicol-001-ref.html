<!DOCTYPE html>
<html>
<head>
  <title>Reference: multi-column layout</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    /* Two columns side by side, each 200px.
       Column 1: green block, Column 2: blue block */
    .row { display: flex; }
    .col1 { width: 200px; height: 50px; background: green; }
    .col2 { width: 200px; height: 50px; background: blue; }
  </style>
</head>
<body>
  <div class="row">
    <div class="col1"></div>
    <div class="col2"></div>
  </div>
</body>
</html>
