<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: column-span: all</title>
  <link rel="match" href="column-span-all-001-ref.html">
  <meta charset="utf-8">
  <style>
    body { margin: 0; }
    .container {
      column-count: 2;
      column-gap: 0;
      width: 400px;
    }
    .col-item {
      height: 50px;
      background: green;
      margin: 0;
    }
    .span-item {
      column-span: all;
      height: 20px;
      background: blue;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="col-item"></div>
    <div class="span-item"></div>
    <div class="col-item" style="background: red;"></div>
  </div>
</body>
</html>
