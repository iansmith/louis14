<!DOCTYPE html>
<title>CSS column-rule reference</title>
<style>
  body { margin: 0; }
</style>
<!-- Simulate: two columns of text with a 4px green vertical line at x=98 -->
<div style="position:relative;width:200px;height:20px">
  <div style="position:absolute;left:0;top:0;width:100px;font:16px/20px Ahem">XXXXXX</div>
  <div style="position:absolute;left:98px;top:0;width:4px;height:20px;background:green"></div>
  <div style="position:absolute;left:100px;top:0;width:100px;font:16px/20px Ahem">XXXXXX</div>
</div>
