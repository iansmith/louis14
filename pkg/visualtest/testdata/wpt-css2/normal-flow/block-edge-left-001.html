<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: child left edge touches parent left edge</title>
  <link rel="match" href="block-edge-left-001-ref.html" />
  <meta name="assert" content="In a block formatting context, the left edge of each box touches the left edge of the containing block" />
  <style>
    body { margin: 0; }
    .parent {
      width: 100px;
      height: 100px;
      border-left: 5px solid blue;
    }
    .child {
      height: 100px;
      border-left: 5px solid orange;
    }
  </style>
</head>
<body>
  <div class="parent">
    <div class="child"></div>
  </div>
</body>
</html>
