<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference</title>
  <style>
    body { margin: 0; }
    .container {
      position: relative;
      width: 100px;
      height: 100px;
      background: green;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 50px;
      height: 50px;
      background: blue;
    }
  </style>
</head>
<body>
  <p>Test passes if there is a green square with a blue square in the top-left corner.</p>
  <div class="container">
    <div class="overlay"></div>
  </div>
</body>
</html>
