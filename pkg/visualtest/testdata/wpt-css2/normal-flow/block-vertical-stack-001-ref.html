<!DOCTYPE html>
<html>
<head>
  <title>CSS Test Reference</title>
  <style>
    body { margin: 0; }
    .stack { position: relative; width: 100px; height: 150px; }
    .a { position: absolute; top: 0; width: 100px; height: 50px; background: red; }
    .b { position: absolute; top: 50px; width: 100px; height: 50px; background: green; }
    .c { position: absolute; top: 100px; width: 100px; height: 50px; background: blue; }
  </style>
</head>
<body>
  <div class="stack">
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
  </div>
</body>
</html>
