<!DOCTYPE html>
<html>
<head>
  <title>CSS Test: display:none removes element from layout</title>
  <link rel="match" href="display-none-001-ref.html" />
  <meta name="assert" content="An element with display:none generates no box and does not affect layout" />
  <style>
    body { margin: 0; }
    .visible { width: 100px; height: 50px; background: green; }
    .hidden { display: none; width: 100px; height: 50px; background: red; }
  </style>
</head>
<body>
  <div class="visible"></div>
  <div class="hidden"></div>
  <div class="visible"></div>
</body>
</html>
